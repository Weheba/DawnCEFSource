name: macOS native codec build

on:
  push:
    branches:
      - codex/native-codecs-146
    paths:
      - .github/workflows/macos-native-codecs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-native-codecs-146
  cancel-in-progress: false

jobs:
  build:
    name: Build CEF and JCEF for macOS arm64
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 240
    env:
      VALIDATION_RELEASE_TAG: dawn-native-codecs.3-macos-validation.1
    steps:
      - name: Check out DawnCEF
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify macOS build host
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          test "$(uname -m)" = "arm64"
          test "$(xcodebuild -version | awk '/Xcode/ { split($2, v, "."); print v[1] }')" -ge 26
          xcrun --find metal
          command -v cmake
          command -v ninja
          command -v java
          command -v jar

          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          test "$free_kb" -ge $((155 * 1024 * 1024))
          echo "cpu=$(sysctl -n hw.logicalcpu)"
          echo "memory_bytes=$(sysctl -n hw.memsize)"
          echo "free_kb=$free_kb"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build CEF and run AudioToolbox media tests
        shell: bash
        env:
          CEF_BUILD_ROOT: ${{ runner.temp }}/DawnCEFBuild
          RESULT_ROOT: ${{ runner.temp }}/dawn-native-codecs-macos
          DAWN_RUN_MEDIA_TESTS: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT"
          bash dawn/build-macos.sh "$CEF_BUILD_ROOT" 2>&1 | tee "$RESULT_ROOT/cef-build.log"

      - name: Locate and verify the CEF distribution
        id: cef
        shell: bash
        env:
          CEF_BUILD_ROOT: ${{ runner.temp }}/DawnCEFBuild
        run: |
          set -euo pipefail
          chromium_src="$CEF_BUILD_ROOT/chromium/src"
          if [[ ! -d "$chromium_src/cef/binary_distrib" ]]; then
            chromium_src="$CEF_BUILD_ROOT/chromium_git/chromium/src"
          fi
          cef_root="$(find "$chromium_src/cef/binary_distrib" -maxdepth 1 -type d -name '*dawn-native-codecs.3*' -print | head -n 1)"
          test -n "$cef_root"
          test -f "$cef_root/cmake/FindCEF.cmake"
          test -f "$cef_root/dawn-codec-build.properties"
          grep -Fqx 'codec.revision=native-codecs.3' "$cef_root/dawn-codec-build.properties"
          grep -Fqx 'macos.h264.decoder=VideoToolbox' "$cef_root/dawn-codec-build.properties"
          grep -Fqx 'macos.aac.decoder=AudioToolbox' "$cef_root/dawn-codec-build.properties"
          echo "root=$cef_root" >> "$GITHUB_OUTPUT"

      - name: Build and package DawnJCEF
        shell: bash
        env:
          JCEF_BUILD_ROOT: ${{ runner.temp }}/DawnJCEFBuild
          RESULT_ROOT: ${{ runner.temp }}/dawn-native-codecs-macos
        run: |
          set -euo pipefail
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          export PATH="$JAVA_HOME/bin:$PATH"
          git clone --filter=blob:none --no-checkout https://github.com/Weheba/DawnJCEF.git "$JCEF_BUILD_ROOT/source"
          git -C "$JCEF_BUILD_ROOT/source" checkout b642dbe1c217b7017f020ef0d39ed7f893443a07
          bash "$JCEF_BUILD_ROOT/source/dawn/build-macos.sh" \
            "${{ steps.cef.outputs.root }}" \
            "$JCEF_BUILD_ROOT/build" \
            "$RESULT_ROOT" 2>&1 | tee "$RESULT_ROOT/jcef-build.log"

      - name: Verify packaged runtime
        id: runtime
        shell: bash
        env:
          RESULT_ROOT: ${{ runner.temp }}/dawn-native-codecs-macos
        run: |
          set -euo pipefail
          jar_path="$(find "$RESULT_ROOT" -maxdepth 1 -type f -name 'jcef-natives-macosx-arm64-*.jar' -print | head -n 1)"
          test -n "$jar_path"
          sha_path="$jar_path.sha256"
          test -f "$sha_path"
          expected="$(awk '{ print $1 }' "$sha_path")"
          actual="$(shasum -a 256 "$jar_path" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          tar_entry="$(jar tf "$jar_path" | grep -E '\.tar\.gz$' | head -n 1)"
          test -n "$tar_entry"
          test "$(basename "$tar_entry" .tar.gz)" = "$(basename "$jar_path" .jar)"
          jar tf "$jar_path" > "$RESULT_ROOT/jar-entries.txt"
          {
            echo "dawn_cef_patch_commit=566c56604e1b904a028951c4c41fd81d53e7df3a"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "jcef_source_commit=b642dbe1c217b7017f020ef0d39ed7f893443a07"
            echo "runner=blacksmith-12vcpu-macos-26"
            echo "xcode=$(xcodebuild -version | paste -sd ' ' -)"
            echo "sha256=$actual"
            echo "jar=$(basename "$jar_path")"
          } > "$RESULT_ROOT/validation.txt"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "sha_path=$sha_path" >> "$GITHUB_OUTPUT"

      - name: Upload validation artifact
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dawn-native-codecs-macos-arm64
          path: |
            ${{ steps.runtime.outputs.jar_path }}
            ${{ steps.runtime.outputs.sha_path }}
            ${{ runner.temp }}/dawn-native-codecs-macos/validation.txt
            ${{ runner.temp }}/dawn-native-codecs-macos/jar-entries.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish retrievable validation package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_ROOT: ${{ runner.temp }}/dawn-native-codecs-macos
        run: |
          set -euo pipefail
          if ! gh release view "$VALIDATION_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$VALIDATION_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Dawn native codecs 3 macOS validation" \
              --notes "Unsigned macOS arm64 validation runtime. Promote only after launcher playback verification."
          fi
          gh release upload "$VALIDATION_RELEASE_TAG" \
            "${{ steps.runtime.outputs.jar_path }}" \
            "${{ steps.runtime.outputs.sha_path }}" \
            "$RESULT_ROOT/validation.txt" \
            --clobber
