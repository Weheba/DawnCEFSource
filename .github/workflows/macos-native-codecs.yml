name: macOS native codec runner probe

on:
  push:
    branches:
      - codex/native-codecs-146
    paths:
      - .github/workflows/macos-native-codecs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-xlarge
          - blacksmith-12vcpu-macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Inspect build capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${{ matrix.runner }}"
          uname -a
          uname -m
          system_profiler SPHardwareDataType
          xcode-select -p
          xcodebuild -version
          sysctl -n hw.logicalcpu
          sysctl -n hw.memsize
          df -h / "$RUNNER_TEMP"
          df -Pk "$RUNNER_TEMP"

          cpu_count="$(sysctl -n hw.logicalcpu)"
          memory_gb="$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))"
          free_gb="$(( $(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }') / 1024 / 1024 ))"
          xcode_version="$(xcodebuild -version | paste -sd ' ' -)"
          echo "::notice title=runner-capacity::runner=${{ matrix.runner }} cpu=${cpu_count} memory_gb=${memory_gb} free_gb=${free_gb} xcode=${xcode_version}"
